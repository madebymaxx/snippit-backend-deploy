# Name of the Spring Boot application
spring.application.name=snippit-ai-chatbot-backend

# Render provides the PORT environment variable.
# Locally, the application will run on port 8080.
server.port=${PORT:8080}

# OpenRouter provides an OpenAI-compatible API.
# Therefore, Spring AI's OpenAI integration can be used.
spring.ai.openai.base-url=https://openrouter.ai/api/v1

# Read the OpenRouter API key from an environment variable.
# Never hardcode the API key in this file or commit it to GitHub.
spring.ai.openai.api-key=${OPENROUTER_API_KEY}

# Automatically select an available free model through OpenRouter.
# Free-model availability and rate limits may change.
spring.ai.openai.chat.options.model=openrouter/free

# CORS configuration
# Allow all origins by default for development/testing
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}